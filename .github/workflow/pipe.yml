name: nombre del pipeline          # Nombre que verás en la pestaña "Actions" de GitHub
on:
  push:
    branches: [ "main" ]            # Se dispara al hacer push a la rama "main"
  workflow_dispatch:                # También se puede lanzar manualmente desde GitHub

jobs:
  echo-job:
    name: Run Echo Commands
    runs-on: ubuntu-latest          # Se ejecuta en una máquina virtual Ubuntu

    steps:
      - name: Step 1 - Basic Echo
        run: echo "Hello! ..."

      - name: Step 2 - Echo Current Date
        run: echo "The current date and time is: $(date)"